owner: AgentoBOAT
repo: Agento-Status

sites:
  - name: Website
    url: https://www.agento.au
  - name: Platform
    url: https://app.agento.au
  - name: API
    url: https://api.agento.au/api/health

status-website:
  cname: status.agento.au
  logoUrl: https://www.agento.au/agento-icon.svg
  favicon: https://www.agento.au/favicon.svg
  faviconSvg: https://www.agento.au/favicon.svg
  links:
    - rel: stylesheet
      href: https://status.agento.au/agento-theme.css
  # Loads the incident lists from this site before the page starts, so visitors'
  # browsers do not call the GitHub API (60 requests an hour per IP address).
  # The file is kept up to date by .github/workflows/incident-cache.yml.
  customHeadHtml: '<script src="/incident-cache.js"></script>'
  name: Agento Status
  introTitle: "Agento service status"
  introMessage: Live availability and response times for the Agento website, platform and API. Checked automatically every five minutes.
  navbar:
    - title: Status
      href: /
    - title: Agento
      href: https://www.agento.au
    - title: Security
      href: https://www.agento.au/security

# See https://upptime.js.org/docs/configuration
